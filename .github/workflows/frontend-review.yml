name: Frontend Review Build

on:
  pull_request:
    paths:
      - frontend/NIRA-repo/**
      - .github/workflows/frontend-review.yml
      - vercel.json
      - README.md
      - docs/**
  push:
    branches:
      - main
      - dev
    paths:
      - frontend/NIRA-repo/**
      - .github/workflows/frontend-review.yml
      - vercel.json
      - README.md
      - docs/**

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/NIRA-repo
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/NIRA-repo/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
